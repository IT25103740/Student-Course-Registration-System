<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Modules')}"></head>
<body>

<aside class="sidebar">
    <div class="sidebar-logo">
        <div class="logo-icon"><i class="bi bi-mortarboard-fill"></i></div>
        EduAll
    </div>
    <div class="sidebar-section">
        <div class="sidebar-section-label">Navigation</div>
        <a th:href="@{/admin-home}" class="nav-item"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
        <a th:href="@{/admin/users}" class="nav-item"><i class="bi bi-people-fill"></i> Users</a>
        <a th:href="@{/admin/modules}" class="nav-item active"><i class="bi bi-journal-bookmark-fill"></i> Modules</a>
    </div>
    <div class="sidebar-footer">
        <a th:href="@{/logout}" class="nav-item" style="color: var(--red-500);"><i class="bi bi-box-arrow-left"></i> Sign Out</a>
    </div>
</aside>

<main class="main-content">
    <div th:replace="~{fragments/toast :: toastContainer}"></div>

    <div class="page-header animate-in">
        <div class="page-header-text">
            <h1 class="heading-xl">Modules</h1>
            <p class="body-md">Configure academic modules, track enrollment capacity, and manage the curriculum.</p>
        </div>
        <button class="btn-primary-pro" data-bs-toggle="modal" data-bs-target="#addModuleModal">
            <i class="bi bi-plus-lg"></i> Add Module
        </button>
    </div>

    <!-- Modules Table -->
    <div class="card-surface animate-in delay-1">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Module</th>
                    <th style="width: 260px;">Enrollment</th>
                    <th>Actions</th>
                    <th style="width: 60px;"></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="module : ${modules}">
                    <td>
                        <div style="font-weight: 600; color: var(--text-0);" th:text="${module.moduleName}">Module</div>
                        <div class="mono text-3" th:text="${module.moduleId}">ID</div>
                    </td>
                    <td>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 0.4rem;">
                            <span class="body-sm" th:text="${module.currentEnrollment + ' enrolled'}">0</span>
                            <span class="mono text-3" th:text="${module.currentEnrollment + ' / ' + module.maxCapacity}">0/0</span>
                        </div>
                        <div class="progress-bar-track">
                            <div class="progress-bar-fill"
                                 th:with="pct=${module.maxCapacity gt 0 ? (module.currentEnrollment * 100 / module.maxCapacity) : 0}"
                                 th:classappend="${pct ge 90} ? 'full' : (${pct ge 70} ? 'warn' : '')"
                                 th:style="'width:' + ${pct} + '%'"></div>
                        </div>
                    </td>
                    <td>
                        <button class="btn-ghost" style="padding: 0.35rem 0.75rem; font-size: 0.78rem;"
                                th:data-mid="${module.moduleId}" th:data-cap="${module.maxCapacity}"
                                onclick="openUpdate(this.getAttribute('data-mid'), parseInt(this.getAttribute('data-cap')))">
                            <i class="bi bi-sliders"></i> Edit Capacity
                        </button>
                    </td>
                    <td>
                        <form th:action="@{/admin/modules/delete}" method="post" style="margin:0;"
                              onsubmit="return confirm('Remove this module from the registry?')">
                            <input type="hidden" name="moduleId" th:value="${module.moduleId}">
                            <button type="submit" class="btn-icon danger"><i class="bi bi-trash3"></i></button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<!-- Add Module Modal -->
<div class="modal fade" id="addModuleModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content pro" style="padding: 2.5rem;">
            <h2 class="heading-lg" style="margin-bottom: 0.4rem;">Add New Module</h2>
            <p class="body-sm" style="margin-bottom: 2rem;">Register a new academic module in the curriculum.</p>
            <form th:action="@{/admin/modules/add}" method="post">
                <div style="margin-bottom: 1rem;">
                    <label class="input-label">Module ID</label>
                    <input type="text" name="moduleId" class="input-pro" placeholder="e.g. IT1010" required>
                </div>
                <div style="margin-bottom: 1rem;">
                    <label class="input-label">Module Name</label>
                    <input type="text" name="moduleName" class="input-pro" placeholder="e.g. Introduction to Computing" required>
                </div>
                <div style="margin-bottom: 1.75rem;">
                    <label class="input-label">Max Capacity</label>
                    <input type="number" name="maxCapacity" class="input-pro" placeholder="Maximum enrollment" required>
                </div>
                <div style="display: flex; gap: 0.75rem;">
                    <button type="button" class="btn-ghost flex-grow-1" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn-primary-pro flex-grow-1">Add Module</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Update Capacity Modal -->
<div class="modal fade" id="updateModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content pro" style="padding: 2.5rem;">
            <h2 class="heading-lg" style="margin-bottom: 0.4rem;">Edit Capacity</h2>
            <p class="body-sm" style="margin-bottom: 2rem;">Adjust enrollment capacity for <span id="updateIdDisplay" class="mono" style="color: var(--blue-500);"></span></p>
            <form th:action="@{/admin/modules/update}" method="post">
                <input type="hidden" name="moduleId" id="updateModuleId">
                <div style="margin-bottom: 1.75rem;">
                    <label class="input-label">New Capacity</label>
                    <input type="number" name="newCapacity" id="updateCapacityInput" class="input-pro" required>
                </div>
                <div style="display: flex; gap: 0.75rem;">
                    <button type="button" class="btn-ghost flex-grow-1" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn-primary-pro flex-grow-1">Update</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function openUpdate(id, current) {
    document.getElementById('updateModuleId').value = id;
    document.getElementById('updateIdDisplay').innerText = id;
    document.getElementById('updateCapacityInput').value = current;
    new bootstrap.Modal(document.getElementById('updateModal')).show();
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
