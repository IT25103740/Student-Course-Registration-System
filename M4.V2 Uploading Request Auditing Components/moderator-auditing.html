<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Audit Requests')}"></head>
<body>

<aside class="sidebar">
    <div class="sidebar-logo">
        <div class="logo-icon"><i class="bi bi-mortarboard-fill"></i></div>
        EduAll
    </div>
    <div class="sidebar-section">
        <div class="sidebar-section-label">Navigation</div>
        <a th:href="@{/moderator-home}" class="nav-item"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
        <a th:href="@{/moderator/audit}" class="nav-item active"><i class="bi bi-clipboard2-check-fill"></i> Audit Requests</a>
        <a th:href="@{/moderator/waitlist}" class="nav-item"><i class="bi bi-clock-history"></i> Waitlist</a>
    </div>
    <div class="sidebar-footer">
        <a th:href="@{/logout}" class="nav-item" style="color: var(--red-500);"><i class="bi bi-box-arrow-left"></i> Sign Out</a>
    </div>
</aside>

<main class="main-content">
    <div th:replace="~{fragments/toast :: toastContainer}"></div>

    <div class="page-header animate-in">
        <div class="page-header-text">
            <h1 class="heading-xl">Audit Requests</h1>
            <p class="body-md">Review student enrollment requests. Use checkboxes for batch processing.</p>
        </div>
        <form th:action="@{/moderator/audit/clear}" method="post">
            <button type="submit" class="btn-ghost">
                <i class="bi bi-archive"></i> Clear Processed
            </button>
        </form>
    </div>

    <!-- Requests Table -->
    <div class="card-surface animate-in delay-1">
        <form id="auditForm" method="post">
            <table class="data-table">
                <thead>
                    <tr>
                        <th style="width: 40px; padding-left: 1.25rem;">
                            <input type="checkbox" id="selectAll" onclick="toggleAll(this)" style="cursor: pointer;">
                        </th>
                        <th>Student</th>
                        <th>Module</th>
                        <th>Status</th>
                        <th style="text-align: right; padding-right: 1.25rem;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="req : ${requests}">
                        <td style="padding-left: 1.25rem;">
                            <input type="checkbox" name="requestIds" th:value="${req.requestId}"
                                   class="row-check" th:disabled="${req.status != 'PENDING'}"
                                   onclick="syncBatch()" style="cursor: pointer;">
                        </td>
                        <td>
                            <div style="font-weight: 600; color: var(--text-0);" th:text="${req.studentId}">STU</div>
                            <div class="mono text-4" th:text="${req.timestamp}">Time</div>
                        </td>
                        <td>
                            <span class="badge-pro badge-neutral" th:text="${req.moduleCode}">IT1010</span>
                        </td>
                        <td>
                            <span class="badge-pro"
                                  th:classappend="${req.status == 'PENDING'} ? 'badge-amber' : (${req.status == 'APPROVED'} ? 'badge-green' : 'badge-red')"
                                  th:text="${req.status}">STATUS</span>
                        </td>
                        <td style="text-align: right; padding-right: 1.25rem;">
                            <div th:if="${req.status == 'PENDING'}" style="display: flex; justify-content: flex-end; gap: 0.35rem;">
                                <button type="button" class="btn-icon" style="color: var(--green-500);"
                                        th:data-rid="${req.requestId}" onclick="execSingle(this.getAttribute('data-rid'), 'approve')">
                                    <i class="bi bi-check-lg"></i>
                                </button>
                                <button type="button" class="btn-icon danger"
                                        th:data-rid="${req.requestId}" onclick="execSingle(this.getAttribute('data-rid'), 'reject')">
                                    <i class="bi bi-x-lg"></i>
                                </button>
                            </div>
                            <span th:unless="${req.status == 'PENDING'}" class="body-sm text-4">Resolved</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(requests)}">
                        <td colspan="5" style="text-align: center; padding: 3rem; color: var(--text-4);">
                            <i class="bi bi-inbox" style="font-size: 2rem; display: block; margin-bottom: 0.5rem; opacity: 0.3;"></i>
                            No enrollment requests found.
                        </td>
                    </tr>
                </tbody>
            </table>
        </form>
    </div>

    <!-- Batch Action Bar -->
    <div id="batchBar" class="fab">
        <span class="body-sm text-0" style="font-weight: 600;">
            <span id="selectedCount" style="color: var(--blue-500);">0</span> selected
        </span>
        <div style="display: flex; gap: 0.5rem;">
            <button class="btn-primary-pro" style="padding: 0.5rem 1.25rem;" onclick="submitBatch('approve')">
                <i class="bi bi-check-lg"></i> Approve
            </button>
            <button class="btn-danger" onclick="submitBatch('reject')">
                <i class="bi bi-x-lg"></i> Reject
            </button>
        </div>
    </div>
</main>

<script>
function toggleAll(src) {
    document.querySelectorAll('.row-check:not(:disabled)').forEach(cb => cb.checked = src.checked);
    syncBatch();
}
function syncBatch() {
    const n = document.querySelectorAll('.row-check:checked').length;
    document.getElementById('batchBar').classList.toggle('visible', n > 0);
    document.getElementById('selectedCount').innerText = n;
}
function submitBatch(action) {
    const form = document.getElementById('auditForm');
    form.action = '/moderator/audit/' + action;
    form.submit();
}
function execSingle(id, action) {
    const f = document.createElement('form'); f.method = 'POST';
    f.action = '/moderator/audit/' + action;
    const inp = document.createElement('input'); inp.type = 'hidden'; inp.name = 'requestId'; inp.value = id;
    f.appendChild(inp); document.body.appendChild(f); f.submit();
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
